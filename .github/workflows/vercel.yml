name: Deploy to Vercel

# Deploys the website (static pages + WebAssembly gallery) to Vercel with the VERCEL_TOKEN secret.
# Create that token with its scope set to your personal Vercel account: the project ("glowkit") is
# created or linked in that account only. VERCEL_ORG_ID / VERCEL_PROJECT_ID are optional overrides.
# Without VERCEL_TOKEN, this workflow does nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check Vercel secrets
        id: check
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not set; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.ready == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - if: steps.check.outputs.ready == 'true'
        uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen and binaryen
        if: steps.check.outputs.ready == 'true'
        run: |
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
          sudo apt-get update && sudo apt-get install -y binaryen libxkbcommon-dev libgtk-3-dev
      - name: Build WebAssembly gallery
        if: steps.check.outputs.ready == 'true'
        run: ./scripts/build-web.sh
      - name: Generate catalog and static pages
        if: steps.check.outputs.ready == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          cargo run --release -p glowkit-gallery -- --dump-json > demos.json
          python3 scripts/catalog.py demos.json
          python3 scripts/gen-site.py demos.json
      - name: Link the Vercel project
        if: steps.check.outputs.ready == 'true' && env.VERCEL_PROJECT_ID == ''
        working-directory: website
        run: npx --yes vercel@65.12.1 link --yes --project glowkit --token "$VERCEL_TOKEN"
      - name: Deploy to Vercel (production)
        if: steps.check.outputs.ready == 'true'
        working-directory: website
        run: npx --yes vercel@65.12.1 deploy --prod --yes --token "$VERCEL_TOKEN"
